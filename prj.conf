CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050_TRIGGER_NONE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_PWM=y

CONFIG_INPUT=y
CONFIG_LOG=y
CONFIG_SHELL=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# --- Enable networking stack ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y

# --- Configure IPV4 and DHCP ---
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# --- Enable WiFi ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_WIFI_SAMPLE_DHCPV4_START=y
CONFIG_WIFI_SAMPLE_AP_SSID="self_robot"
CONFIG_WIFI_SAMPLE_AP_IP_ADDRESS="192.168.55.1"
CONFIG_WIFI_SAMPLE_AP_PSK="12345678"
CONFIG_WIFI_SAMPLE_AP_NETMASK="255.255.255.0"
CONFIG_WIFI_SAMPLE_SSID="thuy_trang_xinh_dep"
CONFIG_WIFI_SAMPLE_PSK="ffffffff"

# Wi-Fi Configuration
#CONFIG_WIFI_NM=y
#CONFIG_WIFI_USAGE_MODE_STA_AP=y

# Network Configuration
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
#CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_UDP=y

# LOG Configuration
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y

# enable to use thread names
CONFIG_THREAD_NAME=y

CONFIG_POSIX_API=y

CONFIG_COUNTER=y
CONFIG_COUNTER_TMR_ESP32=y